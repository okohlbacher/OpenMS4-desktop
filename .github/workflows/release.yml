name: Release Desktop

on:
  push:
    tags: ['desktop-v*']

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download packages from successful branch CI
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          # Ask the API directly: 'gh run list --status success' on the runner image does not
          # match a run whose first attempt failed, which would refuse a release whose CI is green.
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/desktop.yml/runs?head_sha=$revision&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful branch CI run exists for $revision"
            exit 1
          fi
          gh run download "$run_id" --pattern 'desktop-*' --dir artifacts
          test "$(find artifacts -name '*.sha256' | wc -l)" -eq 5
          find artifacts -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do
            sed -i 's/\r$//' "$checksum"
            (cd "$(dirname "$checksum")" && shasum -a 256 -c "$(basename "$checksum")")
          done
      - name: Publish tested packages
        run: |
          gh release create "${{ github.ref_name }}" \
            ./artifacts/desktop-*/* \
            --verify-tag --prerelease --title "Desktop ${{ github.ref_name }}" \
            --notes "Each archive carries the GUI SDK, TOPPView, ImageCreator, INIFileEditor, TOPPAS and ExecutePipeline, and requires the pinned openms4-core SDK and a matching Qt 6.7. Interactive tests stay disabled in this headless build."
